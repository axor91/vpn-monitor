version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vpn-monitor-backend
    restart: unless-stopped
    network_mode: host
    volumes:
      - vpn_data:/app/data
    environment:
      - VPN_HOST=0.0.0.0
      - VPN_PORT=8052
      - VPN_BASE_PATH=/vpn-monitor
      - VPN_FRONTEND_URL=http://127.0.0.1:3052
      - VPN_CORS_ORIGINS=["http://127.0.0.1:3052","https://lmtools.ru"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8052/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vpn-monitor-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8052
      - PORT=3052
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

volumes:
  vpn_data:
